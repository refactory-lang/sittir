packages:
  - 'packages/*'
  - 'rust/crates/sittir-rust'
  - 'rust/crates/sittir-typescript'
  - 'rust/crates/sittir-python'

# pnpm 10 moved these out of package.json's "pnpm" field (which is no longer read).
onlyBuiltDependencies:
  - esbuild
  - tree-sitter-cli
  - tree-sitter-python
# Security floors for transitive dev-toolchain deps (dependabot):
# changesets pulls js-yaml/picomatch; vitest pulls vite -> postcss/nanoid.
overrides:
  vite: ^8.0.16
  'js-yaml@3': ^3.15.1
  'js-yaml@4': ^4.3.1
  'nanoid@3': ^3.3.18
  'postcss@8': ^8.5.23
