packages:
  - 'packages/*'
  - 'rust/crates/sittir-*'

# pnpm 10 moved these out of package.json's "pnpm" field (which is no longer read).
onlyBuiltDependencies:
  - esbuild
  - tree-sitter-cli
  - tree-sitter-python
# Security floors for transitive dev-toolchain deps (dependabot):
# changesets pulls js-yaml/picomatch; vitest pulls vite -> postcss/nanoid.
overrides:
  vite: '>=8.0.16 <9'
  'js-yaml@3': ^3.15.1
  'js-yaml@4': ^4.3.1
  'nanoid@3': ^3.3.18
  'postcss@8': ^8.5.23
  # npm never published v0.24.2 (tree-sitter-rust#318); every dependent takes the tag.
  tree-sitter-rust: github:tree-sitter/tree-sitter-rust#v0.24.2
# tree-sitter-typescript 0.23.2 extends tree-sitter-javascript ^0.23.1, which authors no
# `reserved` block; 0.25.0 is the first release that does, and typescript inherits it.
  'tree-sitter-typescript>tree-sitter-javascript': 0.25.0
