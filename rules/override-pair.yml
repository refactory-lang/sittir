id: override-pair
language: TypeScript
severity: hint
message: >
  Named object entry (rule/group/etc.) in a grammar.sittir.ts wire payload,
  immediately preceded by a comment explaining it. Companion declaration-side
  rule for scripts/wave5-relocate-overrides-comments.mts — paired 1:1 with
  override-pair-comment.yml by file, in source order.
files:
  - packages/rust/grammar.sittir.ts
  - packages/typescript/grammar.sittir.ts
  - packages/python/grammar.sittir.ts
rule:
  kind: pair
  follows:
    kind: comment
    stopBy: neighbor
