id: long-inline-comment-block
language: TypeScript
severity: hint
message: >
  3+ consecutive `//` line comments (or an equivalent multi-line block
  comment). Per AGENTS.md "Wave-style decomposition before commits": a
  comment block this long, sitting in the middle of code, signals that
  the chunk it explains should be promoted to a named private helper —
  the explanation becomes the function name (+ a short JSDoc/glossary
  entry per wave-5 convention), not a comment above inline code.
files:
  - packages/codegen/src/**
  - packages/rust/overrides.ts
  - packages/typescript/overrides.ts
  - packages/python/overrides.ts
  - packages/rust/base.ts
ignores:
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test-d.ts"
rule:
  kind: comment
  regex: '^//'
  follows:
    kind: comment
    regex: '^//'
    stopBy: neighbor
    follows:
      kind: comment
      regex: '^//'
      stopBy: neighbor
note: >
  Wave 5 comment-cleanup audit (2026-07-28): starter rule, not yet run to
  completion. Matches the 3rd+ comment in ANY run of 3+ consecutive line
  comments — a run of N comments produces N-2 matches (one per node once
  the 2-deep `follows` chain is satisfied), not one match per run. When
  triaging, group consecutive matches by adjacent line number into a
  single candidate block rather than treating each match as independent.
  Does NOT distinguish "explains the next code chunk" (the wave-5 target)
  from "standalone rationale block with no adjacent code to extract"
  (e.g. a file-header comment, or grammar-authoring rationale in
  overrides.ts that doesn't correspond to a promotable code chunk) —
  read each match's context before deciding to extract vs. leave as-is.
