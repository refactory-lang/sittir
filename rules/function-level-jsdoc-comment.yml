id: function-level-jsdoc-comment
language: TypeScript
severity: hint
message: >
  Companion to function-level-jsdoc.yml — matches the JSDoc comment node
  itself (not the declaration it precedes), so tooling can read its exact
  text/line range for mechanical relocation into the matching glossary doc.
files:
  - packages/codegen/src/**
ignores:
  - '**/__tests__/**'
  - '**/*.test.ts'
  - '**/*.test-d.ts'
rule:
  kind: comment
  regex: '^/\*\*'
  precedes:
    stopBy: neighbor
    any:
      - kind: function_declaration
      - kind: method_definition
      - kind: interface_declaration
      - kind: class_declaration
      - kind: type_alias_declaration
      - kind: property_signature
      - kind: method_signature
      - all:
          - kind: export_statement
          - has:
              field: declaration
              any:
                - kind: function_declaration
                - kind: interface_declaration
                - kind: class_declaration
                - kind: type_alias_declaration
note: >
  Wave 5 mechanical relocation codemod (scripts/wave5-relocate-jsdoc.mts)
  pairs this rule's matches 1:1 (by file, in source order) with
  function-level-jsdoc.yml's matches — each comment match is the JSDoc
  immediately preceding the declaration matched at the same index.
