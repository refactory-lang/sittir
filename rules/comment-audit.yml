id: comment-audit
language: TypeScript
severity: hint
message: >
  Non-JSDoc comment (`//` line comment, or a `/* */` block that isn't
  `/** */`-style). Per AGENTS.md "Wave-style decomposition before commits":
  every comment is a candidate for removal via relocation. If it sits inside
  a function/method body, the code it explains should be hoisted into a
  named helper (or the function decomposed) — the comment becomes the
  helper's name, not prose above a chunk. If it documents a function, type,
  interface, class, const, or other declaration, it's a candidate for the
  matching glossary doc (docs/glossary/<dir>.md for packages/codegen/src, or
  the per-grammar overrides glossary). No length threshold, no attachment-type
  restriction — flag everything in scope; pass 2 decides case by case.
files:
  - packages/codegen/src/**
  - packages/rust/grammar.sittir.ts
  - packages/typescript/grammar.sittir.ts
  - packages/python/grammar.sittir.ts
  - packages/rust/base.ts
ignores:
  - '**/__tests__/**'
  - '**/*.test.ts'
  - '**/*.test-d.ts'
rule:
  kind: comment
  not:
    regex: '^/\*\*'
note: >
  Audit hint only. scripts/relocate-comments-to-glossary.mts relocates every
  comment in scope — JSDoc or not, above a declaration or inside its body —
  into docs/glossary/<dir>.md; directive comments (@ts-*, eslint,
  @rule-type-consts, /// <reference>) are the only ones it leaves.
