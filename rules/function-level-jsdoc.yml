id: function-level-jsdoc
language: TypeScript
severity: hint
message: >
  Function/method-level JSDoc block. Per AGENTS.md "Wave-style decomposition
  before commits" (wave 5+): this documentation should move to (or update)
  an entry in docs/compiler-phase-glossary.md instead of living as a JSDoc
  block above the function in source. Source keeps at most a one-line
  comment for a genuinely non-obvious WHY — never a restated WHAT.
files:
  - packages/codegen/src/**
ignores:
  - "**/__tests__/**"
  - "**/*.test.ts"
  - "**/*.test-d.ts"
rule:
  any:
    - kind: function_declaration
    - kind: method_definition
    - all:
        - kind: export_statement
        - has:
            field: declaration
            kind: function_declaration
        - not:
            has:
              field: declaration
              kind: type_alias_declaration
        - not:
            has:
              field: declaration
              kind: interface_declaration
        - not:
            has:
              field: declaration
              kind: lexical_declaration
  follows:
    kind: comment
    regex: '^/\*\*'
    stopBy: neighbor
note: >
  Wave 5 comment-cleanup audit (2026-07-28): narrowed to actual
  function/method declarations (`function_declaration`, `method_definition`,
  or `export function`) — no longer matches `export const`/`export type`/
  `export interface`, whose doc comments describe data shapes, not function
  contracts, and are out of the AGENTS.md "function-level doc comment" rule's
  scope (left as source-level documentation, not migrated to the glossary).
  Cross-check each match against whether docs/compiler-phase-glossary.md
  already documents the function before moving/rewriting anything.
