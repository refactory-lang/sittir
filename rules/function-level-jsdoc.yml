id: function-level-jsdoc
language: TypeScript
severity: hint
message: >
  Function/method/type/const-level JSDoc block. Per AGENTS.md "Wave-style
  decomposition before commits": this documentation should move to
  (or update) an entry in docs/compiler-phase-glossary.md (or the matching
  docs/glossary/<dir>.md) instead of living as a JSDoc block above the
  declaration in source. Source keeps at most a one-line comment for a
  genuinely non-obvious WHY — never a restated WHAT.
files:
  - packages/codegen/src/**
ignores:
  - '**/__tests__/**'
  - '**/*.test.ts'
  - '**/*.test-d.ts'
rule:
  any:
    - kind: function_declaration
    - kind: method_definition
    - kind: interface_declaration
    - kind: class_declaration
    - kind: type_alias_declaration
    - kind: lexical_declaration
    - kind: property_signature
    - kind: method_signature
    - all:
        - kind: export_statement
        - has:
            field: declaration
            any:
              - kind: function_declaration
              - kind: interface_declaration
              - kind: class_declaration
              - kind: type_alias_declaration
              - kind: lexical_declaration
  follows:
    kind: comment
    regex: '^/\*\*'
    stopBy: neighbor
note: >
  Audit hint only. Relocation is mechanical: scripts/relocate-comments-to-glossary.mts
  files every comment (not just JSDoc) under the declaration it precedes or
  encloses, body comments as sub-sections, and strips it from source.
