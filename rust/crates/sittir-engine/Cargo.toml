[package]
name = "sittir-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The library every sittir grammar addon shares at run time: the one tree-sitter runtime and the statics a process holds once."

# A grammar addon built with `-C prefer-dynamic` links the `dylib`; without the
# flag it takes the `rlib` and links everything statically.
[lib]
crate-type = ["dylib", "rlib"]

[dependencies]
tree-sitter = { workspace = true }

[lints]
workspace = true
