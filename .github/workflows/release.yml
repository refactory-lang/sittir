# Release: version, build every platform's binaries, check, publish.
#
# One ordered flow:
# 1. `version`: Changesets opens or updates the "Version Packages" PR while
#    changesets are pending. Otherwise, when a public package's version is
#    not on npm yet, the run goes on to publish.
# 2. `native`: each target in NATIVE_TARGETS builds its release binaries,
#    with the engine and std copies they link.
# 3. `publish`: napi makes each grammar's platform packages
#    (`sittir-<grammar>-<platform>`) and declares them as optional
#    dependencies of `@sittir/<grammar>`; `check:published --release` checks
#    every pack; the platform packages publish; then the `@sittir/*` packages.
#    A platform package is never later than the grammar package that needs it.
#    A rerun skips every version npm already has.
#
# A `dry-run` dispatch runs every step with `npm publish --dry-run` (and
# `pnpm publish --dry-run`) in place of each publish, and opens no version PR.
#
# Setup — npm Trusted Publishers (OIDC): add GitHub Actions as a trusted
# publisher (repo + workflow: release.yml) for every published package.
# Fallback: set NPM_TOKEN in the repository secrets.

name: Release

# Gated to manual dispatch until npm publishing credentials are set up
# (no Trusted Publisher or NPM_TOKEN is configured yet, so a push run
# failed `ENEEDAUTH`). Add `push: branches: [master]` once they are.
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Run every step, with a dry-run publish in place of each publish
        type: boolean
        default: true

# A release runs to the end: cancelling one between the platform packages
# and the grammar packages would leave a version half published.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# Crate-download resilience for the release napi builds (see ci.yml for rationale):
# disable HTTP/2 multiplexing to sidestep `[16] Error in the HTTP2 framing layer`,
# retry other transient registry fetch failures.
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  version:
    name: Version, or plan the publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Open or update the version PR
        id: changesets
        if: ${{ !inputs.dry-run }}
        uses: changesets/action@v1
        with:
          version: pnpm changeset:version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Enable auto-merge on version PR
        if: steps.changesets.outputs.hasChangesets == 'true'
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.RELEASE_TOKEN }}
          script: |
            const { data: pulls } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:changeset-release/master`
            });
            if (pulls.length === 0) return;
            const pr = pulls[0];
            await github.graphql(`
              mutation($id: ID!) {
                enablePullRequestAutoMerge(input: { pullRequestId: $id, mergeMethod: SQUASH }) {
                  pullRequest { number }
                }
              }
            `, { id: pr.node_id });
            console.log(`Auto-merge enabled on PR #${pr.number}`);
      - name: Plan the publish
        id: plan
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PENDING: ${{ steps.changesets.outputs.hasChangesets }}
        run: |
          unpublished=$(npx tsx packages/tools/src/scripts/unpublished-packages.ts)
          echo "Not on npm yet:"; echo "${unpublished:-  (none)}"
          if [ "$DRY_RUN" = "true" ] || { [ "$PENDING" != "true" ] && [ -n "$unpublished" ]; }; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

  native:
    name: native (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.host }}
    # Every leg runs to the end, so one run shows every target's failure;
    # the publish job needs them all.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, host: macos-15 }
          - { target: x86_64-unknown-linux-gnu, host: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, host: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, host: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-musl, host: ubuntu-22.04 }
          - { target: x86_64-pc-windows-msvc, host: windows-2022 }
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain (pinned, ${{ matrix.target }})
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}
      - name: Cross toolchain (${{ matrix.target }})
        uses: ./.github/actions/native-cross
        with:
          target: ${{ matrix.target }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      # `shell: bash`: windows runners default `run:` steps to PowerShell,
      # which can't parse this `for` loop.
      - name: Build the release binaries
        shell: bash
        run: |
          grammars=$(npx tsx packages/tools/src/scripts/list-grammars.ts stable)
          for crate in $grammars; do
            npx tsx scripts/build-native.mts "${crate}" --release --target "${{ matrix.target }}" $NATIVE_BUILD_FLAGS
          done
      # Every addon holds the stamp of the engine it was built against, and
      # build-native refused an engine copy that holds another, so a release
      # build that missed the commit would ship a `local` stamp.
      - name: Every addon is stamped with this commit
        shell: bash
        run: |
          npx tsx packages/cli/src/cli.ts tool native-images --stamp packages/*/native/*.node \
            | node -e 'let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => { const want = `@${process.env.GITHUB_SHA}`; let ok = true; for (const { image, stamp } of JSON.parse(s)) { if (stamp.endsWith(want)) console.log(`${image}: ${stamp}`); else { console.log(`::error::${image} holds ${stamp}, not a stamp of ${process.env.GITHUB_SHA}`); ok = false; } } process.exitCode = ok ? 0 : 1; });'
      # Each `.node` loads the engine and std copies built beside it.
      - name: Upload the binaries
        uses: actions/upload-artifact@v4
        with:
          name: release-bindings-${{ matrix.target }}
          path: |
            packages/*/native/*.node
            packages/*/native/*.dylib
            packages/*/native/*.so
            packages/*/native/*.dll
          if-no-files-found: error

  publish:
    name: Check and publish
    needs: [version, native]
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - name: Install npm v11 (OIDC trusted publishing)
        run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Build the packages
        run: pnpm run build:packages
      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: release-bindings
          pattern: release-bindings-*
      - name: Make and fill the platform packages, and declare them on the grammar packages
        run: npx tsx packages/tools/src/scripts/native-packages.ts assemble release-bindings
      - name: Check every pack, and install and run the packages outside the workspace
        run: pnpm run check:published --release
      - name: Publish the platform packages
        run: npx tsx packages/tools/src/scripts/native-packages.ts publish ${{ inputs.dry-run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
      - name: Publish the @sittir packages (dry run)
        if: ${{ inputs.dry-run }}
        run: pnpm -r --filter "./packages/*" publish --dry-run --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: true
      - name: Publish the @sittir packages
        if: ${{ !inputs.dry-run }}
        uses: changesets/action@v1
        with:
          publish: pnpm changeset:publish
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
