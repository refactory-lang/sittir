name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches-ignore: ["sub**"]

# Crate-download resilience for every cargo-running job. The napi builds fetch
# from a cold registry and intermittently die on `download of <crate> failed` /
# `[16] Error in the HTTP2 framing layer` (libcurl's HTTP/2 connection collapsing
# mid-fetch). Disabling HTTP/2 multiplexing forces one request per connection,
# sidestepping the framing bug; retry covers other transient blips. Workflow-level
# so it's a single source across CI / cargo-check / napi-build / parity.
# (The local-dev equivalent lives in the gitignored .cargo/config.toml.)
env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"

jobs:
  # Builds the packages and native addons once, hands the build to the test
  # shards, then runs the checks that need only the build while the shards run.
  build:
    name: build (24.x)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm run build` builds the napi crates in parallel, so the pinned
      # toolchain must be installed before it: otherwise each crate's cargo
      # asks rustup to install it at once and the downloads collide.
      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain

      # `pnpm run build` compiles the napi crates from a cold cargo registry.
      # Cache the registry + target dir so cached crates skip the download path
      # entirely (the `.cargo/config.toml` net hardening covers the cold-cache run).
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: pnpm run build

      - name: Upload the build for the test shards
        uses: actions/upload-artifact@v4
        with:
          name: workspace-build
          path: |
            packages/*/dist
            packages/types/build
            packages/*/tsconfig.build.tsbuildinfo
            packages/*/native/*.node
            packages/*/native/*.so
            node_modules/.cache/sittir/native-build/
          include-hidden-files: true
          if-no-files-found: error

      # Compiling a grammar reads its generated layer's hash through the
      # pinned build, and the required-slot census compiles every grammar.
      - name: Bootstrap the pinned build
        uses: ./.github/actions/bootstrap

      - name: Type check
        run: pnpm run type-check
      - name: Required-slot census (strict and loose config)
        run: pnpm run type-check:required-slots

      - name: Lint generated packages (strict — zero warnings)
        run: npx oxlint -c oxlint.config.ts --deny-warnings packages/rust/src packages/typescript/src packages/python/src

      - name: Lint
        run: pnpm run lint

      - name: Principle #14 ratchet (propose-14, R0)
        # Fails when any pipeline module's non-conforming signature count
        # EXCEEDS packages/codegen/.principle14-baseline.json - the ratchet
        # only goes down. Sweep rows (R1-R4) lower the baseline in-PR.
        run: npx tsx packages/cli/src/cli.ts tool propose-14

      - name: Format check
        run: pnpm run format:check
        continue-on-error: true

      - name: Benchmark reporting tests
        # The benchmark workflows run these with `node --test` before any
        # build, so they stay outside vitest.
        run: node --test scripts/ci/arena-benchmark-*.test.mjs

      - name: Security Audit
        run: pnpm audit --audit-level moderate
        continue-on-error: true

  # The whole suite split across parallel runners. Each shard writes a blob
  # report with its coverage; `CI (24.x)` merges them into the one run that
  # is recorded.
  test:
    name: test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: .

      # The artifact keeps the build job's file times, which predate this
      # checkout, so every project reads as older than its sources.
      - name: Date the downloaded build after the checkout
        run: |
          now=$(date +%s)
          find packages node_modules/.cache/sittir \( -path '*/dist/*' -o -path 'packages/types/build/*' -o -name '*.tsbuildinfo' -o -name '*.node' -o -name '*.so' -o -path '*/native-build/*' \) -type f -exec touch -d "@$now" {} +

      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Bootstrap the pinned build
        uses: ./.github/actions/bootstrap

      # Tests that build a parser each install the wasm toolchain when it is
      # missing, and concurrent installs corrupt one another.
      - name: Install the wasm toolchain once
        run: npx tsx -e "import { ensureWasmToolchain } from './packages/codegen/src/transpile/tree-sitter-cli.ts'; ensureWasmToolchain();"

      - name: Test
        run: pnpm exec vitest run --coverage --shard=${{ matrix.shard }}/${{ strategy.job-total }} --reporter=default --reporter=blob

      - name: Upload the blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: .vitest-reports/
          include-hidden-files: true
          if-no-files-found: error

  # The required check. It passes only when the build job and every shard
  # passed, then merges the shards' reports into the one whole-suite run that
  # `test-and-record` records and covers.
  CI:
    name: CI (24.x)
    needs: [build, test]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Every upstream job passed
        if: ${{ needs.build.result != 'success' || needs.test.result != 'success' }}
        run: |
          echo "build: ${{ needs.build.result }}, test shards: ${{ needs.test.result }}"
          exit 1

      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the blob reports
        uses: actions/download-artifact@v4
        with:
          pattern: vitest-blob-*
          merge-multiple: true
          path: .vitest-reports

      - name: Merge the shards' reports, record and cover
        run: pnpm run test -- --merge-reports --coverage

  # The whole suite again on the newest Node the engines floor admits, over
  # the build the `build (24.x)` job made: the packages and native addons
  # carry no Node version, so only the runtime under the tests changes.
  test-node-26:
    name: test (26.x, shard ${{ matrix.shard }}/${{ strategy.job-total }})
    needs: build
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 26.x
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: workspace-build
          path: .

      - name: Date the downloaded build after the checkout
        run: |
          now=$(date +%s)
          find packages node_modules/.cache/sittir \( -path '*/dist/*' -o -path 'packages/types/build/*' -o -name '*.tsbuildinfo' -o -name '*.node' -o -name '*.so' -o -path '*/native-build/*' \) -type f -exec touch -d "@$now" {} +

      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain

      - name: Bootstrap the pinned build
        uses: ./.github/actions/bootstrap

      - name: Install the wasm toolchain once
        run: npx tsx -e "import { ensureWasmToolchain } from './packages/codegen/src/transpile/tree-sitter-cli.ts'; ensureWasmToolchain();"

      - name: Test
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # Passes only when the build job and every Node 26 shard passed.
  CI-26:
    name: CI (26.x)
    needs: [build, test-node-26]
    if: ${{ always() }}
    runs-on: ubuntu-latest

    steps:
      - name: Every upstream job passed
        run: |
          echo "build: ${{ needs.build.result }}, test shards: ${{ needs.test-node-26.result }}"
          [ "${{ needs.build.result }}" = success ] && [ "${{ needs.test-node-26.result }}" = success ]

  # Spec 016 T009 (follow-up) — regression-checker (native mode).
  #
  # RETIRED the TS/JS-mode sibling job (`regression-checker`, compared
  # against `specs/016-parity-regressions/baselines/ts.json` via
  # `SITTIR_BACKEND=typescript`) — it drove the deprecated js/dispatch
  # engine, which is no longer the source of truth (the Rust native
  # engine is, per CLAUDE.md), and `SITTIR_BACKEND=typescript` isn't
  # even the supported non-native selector anymore (`js` is). This native-mode job is the durable gate
  # going forward; `ts.json` / the retired job's history remain under
  # specs/016-parity-regressions/ as a record of the completed feature.
  #
  # Gated on `napi-build` so the linux x86_64-gnu `.node` artifacts
  # produced by that matrix are available to dispatch
  # `SITTIR_BACKEND=native` through the shared native boundary.
  #
  # The check-baseline-regression script is backend-agnostic (the same
  # five verdict rules apply to both `ts.json` and `native.json` per
  # `contracts/baseline-json.md`); only the input differs. This job
  # downloads the `bindings-x86_64-unknown-linux-gnu` artifact, places
  # the `.node` files where the per-grammar napi loaders expect them,
  # collects the head baseline, and diffs against the base SHA's
  # committed `native.json`.
  #
  # The `napi-build` job runs the parity test suite under `--ignored`
  # and gates on it, but it does NOT read the baseline JSONs, so a
  # native-count drop would slip through it. This job is the durable
  # gate for counts.
  #
  # Skipped on direct pushes (no base ref to diff against). Only runs
  # on `pull_request` events.
  regression-checker-native:
    name: baseline regression check
    runs-on: ubuntu-22.04
    needs: napi-build
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout PR head with full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download napi `.node` artifacts (linux x86_64-gnu)
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: /tmp/016-bindings
      - name: Stage `.node` artifacts into the grammar packages
        # The artifact keeps the upload step's repo-relative paths: each
        # `packages/<grammar>/native/*.node` and the build stamp under
        # `node_modules/.cache/sittir/native-build/` that the loader checks
        # it against. Copy both back into the workspace.
        run: |
          cp -R /tmp/016-bindings/. ./
          find packages -path "*/native/*.node" -print
      - name: Resolve base SHA
        id: base
        run: echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
      # The committed baseline lives at packages/tools/baselines/native.json
      # (moved out of the archived specs/ tree). A base SHA that predates the
      # file skips the diff rather than failing — the gate self-activates for
      # every PR whose base carries the baseline.
      - name: Snapshot base native.json
        id: snapshot
        run: |
          mkdir -p /tmp/016-base
          if git show "${{ steps.base.outputs.sha }}:packages/tools/baselines/native.json" \
            > /tmp/016-base/native.json 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::base SHA has no packages/tools/baselines/native.json — skipping baseline diff"
          fi
      - name: Collect head native.json
        if: steps.snapshot.outputs.present == 'true'
        run: |
          mkdir -p /tmp/016-head
          SITTIR_BACKEND=native npx tsx packages/tools/src/scripts/collect-baseline.ts \
            > /tmp/016-head/native.json
      - name: Diff native.json against base (verdict rules)
        if: steps.snapshot.outputs.present == 'true'
        run: |
          npx tsx packages/tools/src/scripts/check-baseline-regression.ts \
            --base /tmp/016-base/native.json \
            --head /tmp/016-head/native.json \
            --declared packages/tools/baselines/native.json

  # Parsed arena views with record builders and parsed/built objects must
  # validate the same rows in every grammar. `validate history --diff` exits
  # non-zero when any row moves between the paired backend reports.
  node-storage-parity:
    name: validation rows under both node storages and constructions
    runs-on: ubuntu-22.04
    needs: napi-build
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download napi `.node` artifacts (linux x86_64-gnu)
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: /tmp/node-storage-bindings
      - name: Stage `.node` artifacts into the grammar packages
        run: |
          cp -R /tmp/node-storage-bindings/. ./
          find packages -path "*/native/*.node" -print
      # Validation compiles every grammar, which reads its generated layer's
      # hash through the pinned build.
      - name: Install Rust toolchain (pinned)
        uses: ./.github/actions/rust-toolchain
      - name: Bootstrap the pinned build
        uses: ./.github/actions/bootstrap
      - name: Validation rows, object storage
        run: |
          npx tsx packages/cli/src/cli.ts validate counts
          cp packages/tools/validation-report.json /tmp/rows-object.json
      - name: Validation rows, arena storage and record construction
        run: |
          npx tsx packages/cli/src/cli.ts validate counts --node-storage arena
          cp packages/tools/validation-report.json /tmp/rows-arena.json
      - name: Arena rows equal object rows
        run: npx tsx packages/cli/src/cli.ts validate history --diff /tmp/rows-object.json /tmp/rows-arena.json

  # Spec 054 — perf regression-checker (native only). Compares the FFI
  # roundtrip + call-count from a fresh native-backend metrics run against
  # the committed `packages/tools/baselines/perf-native.json`.
  # Regressions > 10% on `ffi.meanRoundtripMs` or `ffi.totalCalls` fail the
  # build EXCEPT when `SITTIR_METRICS_FFI_WARN_ONLY=1` (set below for the
  # one-month calibration window per FR-008). Skipped when napi build
  # artifacts are unavailable. Cross-platform deltas auto-skip via the
  # check's `[INFO] platform mismatch` branch — the perf gate is darwin-only
  # for now (the baseline was collected on Apple M4 Pro). Linux baseline
  # collection is a follow-up; until then, the gate is a no-op on linux
  # CI but the metrics artifacts still get uploaded for inspection.
  # A grammar package ships its native binaries inside itself. This packs the
  # packages, installs them outside the workspace and runs createEngine, parse
  # and render there, on the one platform whose binaries this job has.
  published-shape:
    name: published package shape
    runs-on: ubuntu-22.04
    needs: napi-build
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download napi `.node` artifacts (linux x86_64-gnu)
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: /tmp/published-bindings
      - name: Stage `.node` artifacts into the grammar packages
        run: |
          cp -R /tmp/published-bindings/. ./
          find packages -path "*/native/*.node" -print
      - name: Install the pinned Rust toolchain
        uses: ./.github/actions/rust-toolchain
      - name: Build the packages (the addons are the napi build's)
        run: pnpm -r --filter './packages/*' --workspace-concurrency=4 run build
      - name: Pack, install outside the workspace, type-check @sittir/types, createEngine + parse + render
        run: pnpm run check:published

  perf-regression-checker:
    name: perf regression check (warn-only)
    runs-on: ubuntu-22.04
    needs: napi-build
    if: github.event_name == 'pull_request'
    env:
      # Warn-only window: 2026-07-19 → 2026-08-18 per spec 054 FR-008.
      # Re-baselined on this date because FFI round-trip tracking (recordFfi)
      # had been drafted but never wired to a real call site since the
      # original 2026-04-26 baseline — see the boundary.ts render() wiring.
      # Flip to enforcing by removing this env block after the window.
      SITTIR_METRICS_FFI_WARN_ONLY: "1"
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download napi `.node` artifacts (linux x86_64-gnu)
        uses: actions/download-artifact@v4
        with:
          name: bindings-x86_64-unknown-linux-gnu
          path: /tmp/054-bindings
      - name: Stage `.node` artifacts into the grammar packages
        run: |
          cp -R /tmp/054-bindings/. ./
          find packages -path "*/native/*.node" -print
      - name: Build the packages the metrics run measures
        run: pnpm -r --filter './packages/*' --workspace-concurrency=4 run build
      - name: Collect fresh metrics (native backend)
        run: |
          SITTIR_BACKEND=native SITTIR_METRICS=1 \
            node packages/tools/dist/scripts/collect-baseline.js > /dev/null
      - name: Check perf baseline (warn-only window)
        run: node packages/cli/dist/cli.js tool check-perf
      - name: Upload metrics artifact for inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metrics-native-${{ github.run_id }}
          path: metrics-native.json
          if-no-files-found: warn

  # Rust workspace compile and lint checks. They need no other job's output, so the job
  # starts immediately; `scope-boundaries` waits on it.
  rust:
    name: cargo check --workspace
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain (pinned)
        uses: ./.github/actions/rust-toolchain
        with:
          components: clippy
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: cargo check --workspace
        run: cargo check --workspace
      - name: Clippy (warnings denied)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
      - name: Clippy with napi bindings (warnings denied)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy with the record arena (warnings denied)
        run: cargo clippy --workspace --all-targets --no-default-features --features sittir-parity-tests/arena -- -D warnings
      - name: Clippy with the record arena and napi bindings (warnings denied)
        run: cargo clippy --workspace --all-targets --features sittir-parity-tests/arena -- -D warnings
      - name: Record arena tests
        run: cargo test --workspace --no-default-features --features sittir-parity-tests/arena
      - name: Typed reader debug diagnostics
        run: cargo test -p sittir-parity-tests --no-default-features --test typed_read --features sittir-core/read-debug-checks

  # Generated output drift: regenerating every grammar must reproduce every
  # committed generated file (parser, TypeScript and Rust outputs, manifests,
  # `test-fixtures.json`) and leave no untracked one. A change to codegen
  # source or a grammar whose regenerated output is not committed with it
  # fails here. It runs on pull requests, where GitHub tests the merge
  # result, and on master after each merge, because two pull requests that
  # each change generated output can merge cleanly and leave master's output
  # stale for the combined source. A failure on master is a red run and
  # nothing more: the fix is a pull request that regenerates, and CI never
  # commits. It needs no other job's output, so it runs alongside them. The
  # parity test itself runs in `napi-build` on each native target.
  generated-output-drift:
    name: generated output drift
    # ubuntu-latest (not ubuntu-22.04, unlike the other rust-* jobs — this
    # one doesn't produce a distributable artifact so there's no glibc-
    # compat target to pin to): the "Regenerate every grammar" step's `npx tsx
    # ... gen --all` runs `tree-sitter generate`, and the locked
    # tree-sitter-cli@0.26.9 prebuilt binary requires GLIBC 2.39, which
    # ubuntu-22.04's 2.35 doesn't have. `CI (24.x)` already runs the same
    # codegen path successfully on ubuntu-latest.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node (for codegen + regen)
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain (pinned)
        uses: ./.github/actions/rust-toolchain
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: Bootstrap the pinned build
        uses: ./.github/actions/bootstrap
      - name: Regenerate every grammar
        # `gen --all` rebuilds each grammar's release binding before it
        # extracts fixtures. The workspace cargo check is the `rust` job's.
        run: |
          grammars=$(npx tsx packages/tools/src/scripts/list-grammars.ts all)
          for grammar in $grammars; do
            npx tsx packages/cli/src/cli.ts gen --grammar "$grammar" --all --no-workspace-check --output "packages/$grammar/src"
          done
      - name: Drift check — the regenerated tree equals the committed one
        run: |
          drift=$(git status --porcelain)
          if [ -n "$drift" ]; then
            echo "Regenerating changed these files, or left them untracked:"
            echo "$drift"
            git diff --stat
            echo "Regenerate locally and commit the result:"
            echo "  pnpm exec tsx packages/cli/src/cli.ts gen --grammar <name> --all --output packages/<name>/src"
            exit 1
          fi
      # This job's Node is the oldest major the engines floor admits. Importing
      # each published entry point catches the syntax this Node lacks and the
      # globals a module reads while it loads; a global used only inside a
      # function (`DisposableStack`, say) fails only when that function is called.
      - name: Build the published packages
        run: pnpm run build:packages
      - name: Every published entry point loads on this Node
        run: node scripts/ci/import-published.mjs

  # The napi-build legs, as rows of the release target table
  # (packages/tools/src/native-targets.ts). A tag run builds every target.
  # Every other run builds x86_64-unknown-linux-gnu alone: its binaries are
  # what regression-checker-native and perf-regression-checker download, and
  # nothing in this workflow reads another leg's. release.yml's native job
  # builds all six, and its publish job checks them, before anything
  # publishes, so the other five legs would only repeat that on every pull
  # request.
  native-targets:
    name: native targets
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Plan the legs
        id: plan
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then targets=(); else targets=(x86_64-unknown-linux-gnu); fi
          matrix=$(npx tsx packages/tools/src/scripts/native-targets.ts "${targets[@]}")
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # Each leg builds every grammar's release addon for its target and, on a
  # runner that can run what it builds, the workspace tests, the stack
  # ceilings and the parity suite.
  napi-build:
    name: napi build (${{ matrix.target }})
    needs: native-targets
    runs-on: ${{ matrix.host }}
    # A tag run's platform legs report without failing the run; on every
    # other run the single linux leg gates.
    continue-on-error: ${{ startsWith(github.ref, 'refs/tags/v') }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.native-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Rust toolchain (pinned, ${{ matrix.target }})
        uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}
      - name: Cross toolchain (${{ matrix.target }})
        uses: ./.github/actions/native-cross
        with:
          target: ${{ matrix.target }}
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # `shell: bash` is required here: this `for` loop is bash syntax, but
      # windows-latest runners default `run:` steps to PowerShell, which
      # can't parse it ("Missing opening '(' after keyword 'for'").
      - name: napi build — grammar-owned native packages
        shell: bash
        run: |
          grammars=$(npx tsx packages/tools/src/scripts/list-grammars.ts stable)
          for crate in $grammars; do
            npx tsx scripts/build-native.mts "${crate}" --release --target "${{ matrix.target }}" $NATIVE_BUILD_FLAGS
          done
      # Each release addon just built, read from the unstripped copy its
      # build keeps: the limit's count of its grammar's costliest whole-encode
      # level, with the one-time frames, must fit ENCODE_STACK_BUDGET. Over
      # it, the step fails with the costliest paths and the largest limit
      # that fits. It only disassembles, so cross-compiled legs run it too.
      - name: encode stack budget
        shell: bash
        run: npx tsx packages/cli/src/cli.ts tool encode-stack
      # `--no-default-features` is required for a bare `cargo test
      # --workspace`: sittir-{rust,typescript,python} default to
      # `napi-bindings` ON (needed for `napi build` above), and workspace
      # feature unification means a plain `cargo test --workspace` links
      # each grammar crate's own test binary WITH napi symbols — which
      # only resolve inside a real Node.js host, so the standalone test
      # binary fails at link time. sittir-parity-tests already requests
      # `default-features = false` on these deps, but that request gets
      # unified away unless the whole workspace test run also disables it.
      - name: cargo test --workspace (skip cross-compiled targets)
        if: matrix.cross == false
        run: cargo test --workspace --no-default-features --target ${{ matrix.target }}
      # The typed read's least stack at each nesting level, dev and release,
      # held to the target's pinned row in typed_read_nesting's CEILINGS. The
      # measured levels are printed, so a target with no row fails here with
      # the values to pin.
      - name: cargo test stack ceilings
        if: matrix.cross == false
        run: |
          cargo test -p sittir-parity-tests --no-default-features --test typed_read_nesting --target ${{ matrix.target }} -- --nocapture the_typed_read_stays_within_its_pinned_stack_ceilings
          cargo test -p sittir-parity-tests --no-default-features --release --test typed_read_nesting --target ${{ matrix.target }} -- --nocapture the_typed_read_stays_within_its_pinned_stack_ceilings
      # T061 — every platform job runs the parity suite (SC-006 gate).
      # On cross-compiled hosts we still invoke the test binary build
      # but skip execution (the resulting binary cannot run on the CI
      # host); the failure path is the build step above.
      - name: cargo test parity (native targets only)
        if: matrix.cross == false
        run: cargo test -p sittir-parity-tests --test parity --target ${{ matrix.target }} -- --nocapture
      # `if: !cancelled()` — without this, a failure in either test step
      # above skips this step entirely by
      # GitHub Actions' default fail-fast-within-job behavior, even
      # though `napi build` already produced a valid, working `.node`.
      # regression-checker-native and perf-regression-checker both
      # `needs: napi-build` and download `bindings-x86_64-unknown-linux-gnu`
      # specifically — without the artifact, they fail outright (or, when
      # blocked on the full 7-target matrix pre-#167, could never even
      # start). Upload regardless of test outcome; the binary itself is
      # still a valid build artifact independent of test pass/fail. Each
      # `.node` loads the engine and std libraries shipped beside it, so
      # they travel with it.
      - name: Upload `.node` artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: |
            packages/*/native/*.node
            packages/*/native/*.dylib
            packages/*/native/*.so
            packages/*/native/*.dll
            node_modules/.cache/sittir/native-build/
          include-hidden-files: true
          if-no-files-found: ignore

  # Spec 012 T060 — surface parity counts in PR job summary so review
  # has visibility on engine drift without spelunking logs. Aggregates
  # the per-platform parity results from `napi-build` into one summary.
  parity-summary:
    name: parity counts summary
    needs: napi-build
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
      - name: Render parity counts to job summary
        run: |
          {
            echo "## Spec 012 parity counts"
            echo ""
            echo "Per-platform parity-suite status from the \`napi-build\` matrix is"
            echo "available in each job log under \`cargo test parity\`. The headline"
            echo "baseline (asserted by \`pnpm -F @sittir/codegen test\`):"
            echo ""
            echo "| grammar | fromPass | rtPass | factoryPass |"
            echo "|--------:|---------:|-------:|------------:|"
            echo "| rust       | 130/148 | 121/136 | 421/959 |"
            echo "| typescript | 127/137 |  96/112 | 387/916 |"
            echo "| python     | 107/114 | 105/115 | 205/860 |"
          } >> "$GITHUB_STEP_SUMMARY"

  glossary-keys:
    name: glossary key ratchet
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Use Node.js 24.x
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Glossary key ratchet
        run: npx tsx packages/cli/src/cli.ts tool glossary-keys

  no-tracked-node-modules:
    name: no tracked node_modules
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - run: bash scripts/assert-no-tracked-node-modules.sh

  # Spec 012 T064 — scope-boundary enforcement. Fails the build if
  # WASM artifacts leak into the MVP, if `cargo publish` reappears in
  # any workflow, if generated render crates contain non-source files,
  # or if disallowed derive-macro crates show up in the dep graph.
  scope-boundaries:
    name: assert scope boundaries
    needs: rust
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust toolchain (pinned)
        uses: ./.github/actions/rust-toolchain
      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
      - name: assert scope boundaries
        run: bash scripts/assert-scope-boundaries.sh
