name: Build benchmark runtime

on:
  workflow_call:
    inputs:
      ref:
        description: The commit to build; empty builds the commit the run is for
        type: string
        default: ''
      label:
        description: Names the build in its artifact prefix, ahead of the run id, so no build's artifact pattern matches another's
        type: string
        default: ''
    outputs:
      prefix:
        value: ${{ jobs.prepare.outputs.prefix }}
      grammars:
        value: ${{ jobs.prepare.outputs.grammars }}

permissions:
  contents: read

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_BUILD_JOBS: '4'

jobs:
  prepare:
    name: Compile shared TypeScript
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      prefix: ${{ steps.plan.outputs.prefix }}
      grammars: ${{ steps.plan.outputs.grammars }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/arena-benchmark-setup
      - name: Plan canonical grammar builds
        id: plan
        env:
          LABEL: ${{ inputs.label }}
        run: |
          export COMMIT=$(git rev-parse HEAD)
          pnpm exec tsx packages/tools/src/scripts/list-grammars.ts stable > "$RUNNER_TEMP/grammars.txt"
          node --input-type=module <<'NODE' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          const grammars = readFileSync(`${process.env.RUNNER_TEMP}/grammars.txt`, 'utf8').trim().split(/\s+/);
          console.log(`grammars=${JSON.stringify(grammars)}`);
          const label = process.env.LABEL ? `-${process.env.LABEL}` : '';
          console.log(`prefix=arena-runtime${label}-${process.env.GITHUB_RUN_ID}-${process.env.GITHUB_RUN_ATTEMPT}`);
          console.log(`commit=${process.env.COMMIT}`);
          NODE
      - uses: actions/cache@v4
        id: compiled
        with:
          path: ${{ runner.temp }}/arena-runtime-typescript
          key: arena-runtime-v2-${{ runner.os }}-${{ runner.arch }}-node26.12.0-${{ steps.plan.outputs.commit }}-typescript
      - name: Compile committed TypeScript packages
        if: steps.compiled.outputs.cache-hit != 'true'
        run: |
          pnpm -r --filter './packages/*' --workspace-concurrency=4 run build
          node scripts/ci/arena-benchmark-runtime.mjs pack "$RUNNER_TEMP/arena-runtime-typescript" typescript packages/*/dist packages/*/build packages/*/tsconfig.build.tsbuildinfo
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.prefix }}-typescript
          path: ${{ runner.temp }}/arena-runtime-typescript/
          retention-days: 7
          if-no-files-found: error
