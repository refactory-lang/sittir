name: Arena benchmarks
run-name: Arena benchmarks (${{ inputs.benchmark }}, ${{ inputs.construction }} construction)

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark to run
        type: choice
        default: all
        options: [all, eager, corpus]
      construction:
        description: How the corpus job's arena arm builds nodes; records runs regex and scm, the grammars every compound kind of which has a record view
        type: choice
        default: objects
        options: [objects, records]

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/benchmark-build.yml
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.prepare.outputs.grammars) }}
    uses: ./.github/workflows/benchmark-native.yml
    with:
      grammar: ${{ matrix.grammar }}
      prefix: ${{ needs.prepare.outputs.prefix }}
  eager-native:
    needs: prepare
    if: inputs.benchmark == 'all' || inputs.benchmark == 'eager'
    uses: ./.github/workflows/benchmark-native.yml
    with:
      grammar: eager
      prefix: ${{ needs.prepare.outputs.prefix }}
  eager:
    needs: [prepare, native, eager-native]
    if: inputs.benchmark == 'all' || inputs.benchmark == 'eager'
    uses: ./.github/workflows/benchmark-eager.yml
    with:
      runtime-prefix: ${{ needs.prepare.outputs.prefix }}
  corpus:
    needs: [prepare, native]
    if: inputs.benchmark == 'all' || inputs.benchmark == 'corpus'
    uses: ./.github/workflows/benchmark-corpus.yml
    with:
      runtime-prefix: ${{ needs.prepare.outputs.prefix }}
      grammars: ${{ inputs.construction == 'records' && '["regex","scm"]' || needs.prepare.outputs.grammars }}
      construction: ${{ inputs.construction }}
