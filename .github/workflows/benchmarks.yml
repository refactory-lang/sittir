name: Arena benchmarks
run-name: Arena benchmarks (${{ inputs.benchmark || 'all' }})

on:
  push:
    branches: [bench/arena-linux-20261022-ba89dd1d8]
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark to run
        type: choice
        default: all
        options: [all, eager, corpus]

permissions:
  contents: read

jobs:
  prepare:
    uses: ./.github/workflows/benchmark-build.yml
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.prepare.outputs.grammars) }}
    uses: ./.github/workflows/benchmark-native.yml
    with:
      grammar: ${{ matrix.grammar }}
      prefix: ${{ needs.prepare.outputs.prefix }}
  eager-native:
    needs: prepare
    if: github.event_name == 'push' || inputs.benchmark == 'all' || inputs.benchmark == 'eager'
    uses: ./.github/workflows/benchmark-native.yml
    with:
      grammar: eager
      prefix: ${{ needs.prepare.outputs.prefix }}
  eager:
    needs: [prepare, native, eager-native]
    if: github.event_name == 'push' || inputs.benchmark == 'all' || inputs.benchmark == 'eager'
    uses: ./.github/workflows/benchmark-eager.yml
    with:
      runtime-prefix: ${{ needs.prepare.outputs.prefix }}
  corpus:
    needs: [prepare, native]
    if: github.event_name == 'push' || inputs.benchmark == 'all' || inputs.benchmark == 'corpus'
    uses: ./.github/workflows/benchmark-corpus.yml
    with:
      runtime-prefix: ${{ needs.prepare.outputs.prefix }}
      grammars: ${{ needs.prepare.outputs.grammars }}
