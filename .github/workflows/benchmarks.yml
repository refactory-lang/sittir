name: Arena benchmarks
run-name: Arena benchmarks (${{ inputs.benchmark == 'oxc-reference' && format('oxc-reference {0}', inputs.feature-ref) || (inputs.benchmark == 'paired-refs' || inputs.benchmark == 'probe' || inputs.benchmark == 'profile' || inputs.benchmark == 'waiting' || inputs.benchmark == 'parse-profile' || inputs.benchmark == 'parse-release' || inputs.benchmark == 'release-profile' || inputs.benchmark == 'drop-split' || inputs.benchmark == 'retained') && format('{0} {1} vs {2}{3}', inputs.benchmark, inputs.feature-ref, inputs.master-ref, inputs.candidates && format(' + {0}', inputs.candidates) || '') || format('{0}, paired node backends', inputs.benchmark) }})

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark to run
        type: choice
        default: all
        options: [all, corpus, paired-refs, probe, profile, waiting, parse-profile, parse-release, release-profile, drop-split, retained, oxc-reference]
      baseline:
        description: all and corpus. A commit to measure beside this one in the same rounds. Empty takes the merge-base with master; none measures this one alone.
        type: string
        default: ''
      feature-ref:
        description: paired-refs and probe, the feature branch or commit; oxc-reference, the one tree measured against oxfmt and oxlint.
        type: string
        default: feat/records
      master-ref:
        description: paired-refs and probe. The master branch or commit; the merge base is the third tree.
        type: string
        default: master
      profile:
        description: paired-refs, probe and oxc-reference. The cargo profile every addon is built with.
        type: choice
        default: release
        options: [release, gate]
      arena:
        description: paired-refs and probe. Also measure the feature tree in arena storage.
        type: boolean
        default: true
      grammars:
        description: probe only. The grammars to probe, space-separated.
        type: string
        default: python regex typescript
      candidates:
        description: paired-refs and probe. More trees beside feature, space-separated name=ref, each also read in arena storage when arena is on.
        type: string
        default: ''
      build-path:
        description: paired-refs and probe. A commit whose change to the build driver every tree's addons are built with. A tree it applies to is patched, any other tree is built as it is, and every tree's stamps must agree. Empty builds each tree with its own.
        type: string
        default: ''
      runner:
        description: The runner label every benchmark job runs on.
        type: string
        default: ubuntu-24.04-arm

permissions:
  contents: read

jobs:
  baseline:
    name: Resolve the baseline
    if: inputs.benchmark == 'all' || inputs.benchmark == 'corpus'
    runs-on: ${{ inputs.runner }}
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve the baseline
        id: resolve
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          case "$BASELINE" in
            none) commit= ;;
            '') commit=$(git merge-base origin/master HEAD) ;;
            *) commit=$(git rev-parse --verify "$BASELINE^{commit}") ;;
          esac
          if [ "$commit" = "$(git rev-parse HEAD)" ]; then commit=; fi
          echo "baseline: ${commit:-none}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  prepare:
    if: inputs.benchmark == 'all' || inputs.benchmark == 'corpus'
    uses: ./.github/workflows/benchmark-build.yml
    with:
      runner: ${{ inputs.runner }}
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.prepare.outputs.grammars) }}
    uses: ./.github/workflows/benchmark-native.yml
    with:
      runner: ${{ inputs.runner }}
      grammar: ${{ matrix.grammar }}
      prefix: ${{ needs.prepare.outputs.prefix }}
  baseline-prepare:
    needs: baseline
    if: needs.baseline.outputs.commit != ''
    uses: ./.github/workflows/benchmark-build.yml
    with:
      runner: ${{ inputs.runner }}
      ref: ${{ needs.baseline.outputs.commit }}
      label: baseline
  baseline-native:
    needs: [baseline, baseline-prepare]
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.baseline-prepare.outputs.grammars) }}
    uses: ./.github/workflows/benchmark-native.yml
    with:
      runner: ${{ inputs.runner }}
      grammar: ${{ matrix.grammar }}
      prefix: ${{ needs.baseline-prepare.outputs.prefix }}
      ref: ${{ needs.baseline.outputs.commit }}
  corpus:
    needs: [prepare, native, baseline, baseline-prepare, baseline-native]
    if: >-
      !cancelled() && needs.native.result == 'success'
      && (needs.baseline.outputs.commit == '' || needs.baseline-native.result == 'success')
      && (inputs.benchmark == 'all' || inputs.benchmark == 'corpus')
    uses: ./.github/workflows/benchmark-corpus.yml
    with:
      runner: ${{ inputs.runner }}
      runtime-prefix: ${{ needs.prepare.outputs.prefix }}
      grammars: ${{ needs.prepare.outputs.grammars }}
      baseline: ${{ needs.baseline.outputs.commit }}
      baseline-prefix: ${{ needs.baseline-prepare.outputs.prefix }}
  paired-refs:
    if: inputs.benchmark == 'paired-refs'
    uses: ./.github/workflows/benchmark-paired-refs.yml
    with:
      runner: ${{ inputs.runner }}
      feature-ref: ${{ inputs.feature-ref }}
      master-ref: ${{ inputs.master-ref }}
      profile: ${{ inputs.profile }}
      arena: ${{ inputs.arena }}
      candidates: ${{ inputs.candidates }}
      build-path: ${{ inputs.build-path }}
  oxc-reference:
    if: inputs.benchmark == 'oxc-reference'
    uses: ./.github/workflows/benchmark-oxc-reference.yml
    with:
      runner: ${{ inputs.runner }}
      sittir-ref: ${{ inputs.feature-ref }}
      profile: ${{ inputs.profile }}
  probe:
    if: inputs.benchmark == 'probe' || inputs.benchmark == 'profile' || inputs.benchmark == 'waiting' || inputs.benchmark == 'parse-profile' || inputs.benchmark == 'parse-release' || inputs.benchmark == 'release-profile' || inputs.benchmark == 'drop-split' || inputs.benchmark == 'retained'
    uses: ./.github/workflows/benchmark-probe.yml
    with:
      runner: ${{ inputs.runner }}
      script: ${{ inputs.benchmark == 'profile' && 'run-profile.py' || inputs.benchmark == 'waiting' && 'run-waiting.py' || inputs.benchmark == 'parse-profile' && 'run-parse-profile.py' || inputs.benchmark == 'parse-release' && 'run-parse-release.py' || inputs.benchmark == 'release-profile' && 'run-release-profile.py' || inputs.benchmark == 'drop-split' && 'run-drop-split.py' || inputs.benchmark == 'retained' && 'run-retained.py' || 'run-probe.py' }}
      feature-ref: ${{ inputs.feature-ref }}
      master-ref: ${{ inputs.master-ref }}
      profile: ${{ inputs.profile }}
      arena: ${{ inputs.arena }}
      grammars: ${{ inputs.grammars }}
      candidates: ${{ inputs.candidates }}
      build-path: ${{ inputs.build-path }}
