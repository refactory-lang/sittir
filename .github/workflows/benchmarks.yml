name: Arena benchmarks
run-name: Arena benchmarks (${{ (inputs.benchmark == 'paired-refs' || inputs.benchmark == 'probe') && format('{0} {1} vs {2}{3}', inputs.benchmark, inputs.feature-ref, inputs.master-ref, inputs.candidates && format(' + {0}', inputs.candidates) || '') || format('{0}, paired node backends', inputs.benchmark) }})

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark to run
        type: choice
        default: all
        options: [all, corpus, paired-refs, probe]
      feature-ref:
        description: paired-refs and probe. The feature branch or commit.
        type: string
        default: feat/records
      master-ref:
        description: paired-refs and probe. The master branch or commit; the merge base is the third tree.
        type: string
        default: master
      profile:
        description: paired-refs and probe. The cargo profile every addon is built with.
        type: choice
        default: release
        options: [release, gate]
      arena:
        description: paired-refs and probe. Also measure the feature tree in arena storage.
        type: boolean
        default: true
      grammars:
        description: probe only. The grammars to probe, space-separated.
        type: string
        default: python regex typescript
      candidates:
        description: paired-refs and probe. More trees beside feature, space-separated name=ref, each also read in arena storage when arena is on.
        type: string
        default: ''

permissions:
  contents: read

jobs:
  prepare:
    if: inputs.benchmark == 'all' || inputs.benchmark == 'corpus'
    uses: ./.github/workflows/benchmark-build.yml
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.prepare.outputs.grammars) }}
    uses: ./.github/workflows/benchmark-native.yml
    with:
      grammar: ${{ matrix.grammar }}
      prefix: ${{ needs.prepare.outputs.prefix }}
  corpus:
    needs: [prepare, native]
    if: inputs.benchmark == 'all' || inputs.benchmark == 'corpus'
    uses: ./.github/workflows/benchmark-corpus.yml
    with:
      runtime-prefix: ${{ needs.prepare.outputs.prefix }}
      grammars: ${{ needs.prepare.outputs.grammars }}
  paired-refs:
    if: inputs.benchmark == 'paired-refs'
    uses: ./.github/workflows/benchmark-paired-refs.yml
    with:
      feature-ref: ${{ inputs.feature-ref }}
      master-ref: ${{ inputs.master-ref }}
      profile: ${{ inputs.profile }}
      arena: ${{ inputs.arena }}
      candidates: ${{ inputs.candidates }}
  probe:
    if: inputs.benchmark == 'probe'
    uses: ./.github/workflows/benchmark-probe.yml
    with:
      feature-ref: ${{ inputs.feature-ref }}
      master-ref: ${{ inputs.master-ref }}
      profile: ${{ inputs.profile }}
      arena: ${{ inputs.arena }}
      grammars: ${{ inputs.grammars }}
      candidates: ${{ inputs.candidates }}
