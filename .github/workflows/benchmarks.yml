name: Arena benchmarks
run-name: Arena benchmarks (${{ inputs.benchmark == 'oxc-reference' && format('oxc-reference {0}', inputs.feature-ref) || (inputs.benchmark == 'paired-refs' || inputs.benchmark == 'probe' || inputs.benchmark == 'profile' || inputs.benchmark == 'waiting' || inputs.benchmark == 'parse-profile' || inputs.benchmark == 'phase-profile' || inputs.benchmark == 'phase-time' || inputs.benchmark == 'phase-flat' || inputs.benchmark == 'alloc-count') && format('{0} {1} vs {2}{3}', inputs.benchmark == 'phase-profile' && format('{0}-phase-profile', inputs.phase) || inputs.benchmark == 'phase-time' && format('{0}-phase-time', inputs.phase) || inputs.benchmark == 'phase-flat' && format('{0}-phase-flat', inputs.phase) || inputs.benchmark == 'alloc-count' && format('{0}-allocs', inputs.phase) || inputs.benchmark, inputs.feature-ref, inputs.master-ref, inputs.candidates && format(' + {0}', inputs.candidates) || '') || format('{0}, paired node backends', inputs.benchmark) }})

on:
  workflow_dispatch:
    inputs:
      benchmark:
        description: Benchmark to run
        type: choice
        default: all
        options: [all, corpus, paired-refs, probe, profile, waiting, parse-profile, phase-profile, phase-time, phase-flat, alloc-count, oxc-reference]
      baseline:
        description: all and corpus. A commit to measure beside this one in the same rounds. Empty takes the merge-base with master; none measures this one alone.
        type: string
        default: ''
      feature-ref:
        description: paired-refs and probe, the feature branch or commit; oxc-reference, the one tree measured against oxfmt and oxlint.
        type: string
        default: feat/records
      master-ref:
        description: paired-refs and probe. The master branch or commit; the merge base is the third tree.
        type: string
        default: master
      profile:
        description: paired-refs, probe and oxc-reference. The cargo profile every addon is built with.
        type: choice
        default: release
        options: [release, gate]
      arena:
        description: paired-refs and probe. Also measure the feature tree in arena storage.
        type: boolean
        default: true
      grammars:
        description: probe, profile, waiting, parse-profile, phase-profile and alloc-count. The grammars to probe, space-separated.
        type: string
        default: python regex typescript
      phase:
        description: phase-profile, phase-time, phase-flat and alloc-count. The corpus phase run; built, the render of built Rust function items; or worker, the paired construction worker's whole timed loop (both with grammars rust). phase-profile samples parse, render, built or worker natively under perf, or edit as JavaScript frames under the inspector's Profiler; alloc-count counts any phase's allocations natively; phase-time times any phase with no profiler, and phase-flat samples it by shared object and symbol with no call chains, both on the builds a paired run measures.
        type: choice
        default: render
        options: [parse, render, edit, built, worker]
      storage:
        description: phase-profile and alloc-count. The node storage the phase runs in.
        type: choice
        default: arena
        options: [arena, object]
      batches-per-engine:
        description: phase-profile and alloc-count. The batches one engine runs before a fresh one is made; 0 keeps one engine for the whole run, as a paired corpus worker does.
        type: string
        default: '50'
      candidates:
        description: paired-refs and probe. More trees beside feature, space-separated name=ref, each also read in arena storage when arena is on.
        type: string
        default: ''
      build-path:
        description: paired-refs and probe. A commit whose change to the build driver every tree's addons are built with. A tree it applies to is patched, any other tree is built as it is, and every tree's stamps must agree. Empty builds each tree with its own.
        type: string
        default: ''
      rustflags:
        description: paired-refs. RUSTFLAGS every tree's addons are built with, the same for every tree (for example -C llvm-args=-align-all-functions=6); empty builds them with none.
        type: string
        default: ''
      identity:
        description: paired-refs. The tree whose renders and edits every version must hold entry by entry (base, master, feature or a candidate's name); where it differs from base a version may hold base's instead, and those entries are listed. A run of a branch that changes output names feature.
        type: string
        default: base
      runner:
        description: The runner label every benchmark job runs on.
        type: string
        default: ubuntu-24.04-arm

permissions:
  contents: read

jobs:
  baseline:
    name: Resolve the baseline
    if: inputs.benchmark == 'all' || inputs.benchmark == 'corpus'
    runs-on: ${{ inputs.runner }}
    outputs:
      commit: ${{ steps.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Resolve the baseline
        id: resolve
        env:
          BASELINE: ${{ inputs.baseline }}
        run: |
          case "$BASELINE" in
            none) commit= ;;
            '') commit=$(git merge-base origin/master HEAD) ;;
            *) commit=$(git rev-parse --verify "$BASELINE^{commit}") ;;
          esac
          if [ "$commit" = "$(git rev-parse HEAD)" ]; then commit=; fi
          echo "baseline: ${commit:-none}"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
  prepare:
    if: inputs.benchmark == 'all' || inputs.benchmark == 'corpus'
    uses: ./.github/workflows/benchmark-build.yml
    with:
      runner: ${{ inputs.runner }}
  native:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.prepare.outputs.grammars) }}
    uses: ./.github/workflows/benchmark-native.yml
    with:
      runner: ${{ inputs.runner }}
      grammar: ${{ matrix.grammar }}
      prefix: ${{ needs.prepare.outputs.prefix }}
  baseline-prepare:
    needs: baseline
    if: needs.baseline.outputs.commit != ''
    uses: ./.github/workflows/benchmark-build.yml
    with:
      runner: ${{ inputs.runner }}
      ref: ${{ needs.baseline.outputs.commit }}
      label: baseline
  baseline-native:
    needs: [baseline, baseline-prepare]
    strategy:
      fail-fast: false
      matrix:
        grammar: ${{ fromJSON(needs.baseline-prepare.outputs.grammars) }}
    uses: ./.github/workflows/benchmark-native.yml
    with:
      runner: ${{ inputs.runner }}
      grammar: ${{ matrix.grammar }}
      prefix: ${{ needs.baseline-prepare.outputs.prefix }}
      ref: ${{ needs.baseline.outputs.commit }}
  corpus:
    needs: [prepare, native, baseline, baseline-prepare, baseline-native]
    if: >-
      !cancelled() && needs.native.result == 'success'
      && (needs.baseline.outputs.commit == '' || needs.baseline-native.result == 'success')
      && (inputs.benchmark == 'all' || inputs.benchmark == 'corpus')
    uses: ./.github/workflows/benchmark-corpus.yml
    with:
      runner: ${{ inputs.runner }}
      runtime-prefix: ${{ needs.prepare.outputs.prefix }}
      grammars: ${{ needs.prepare.outputs.grammars }}
      baseline: ${{ needs.baseline.outputs.commit }}
      baseline-prefix: ${{ needs.baseline-prepare.outputs.prefix }}
  paired-refs:
    permissions:
      contents: write
    if: inputs.benchmark == 'paired-refs'
    uses: ./.github/workflows/benchmark-paired-refs.yml
    with:
      runner: ${{ inputs.runner }}
      feature-ref: ${{ inputs.feature-ref }}
      master-ref: ${{ inputs.master-ref }}
      profile: ${{ inputs.profile }}
      arena: ${{ inputs.arena }}
      candidates: ${{ inputs.candidates }}
      build-path: ${{ inputs.build-path }}
      rustflags: ${{ inputs.rustflags }}
      identity: ${{ inputs.identity }}
  oxc-reference:
    permissions:
      contents: write
    if: inputs.benchmark == 'oxc-reference'
    uses: ./.github/workflows/benchmark-oxc-reference.yml
    with:
      runner: ${{ inputs.runner }}
      sittir-ref: ${{ inputs.feature-ref }}
      profile: ${{ inputs.profile }}
  probe:
    permissions:
      contents: write
    if: inputs.benchmark == 'probe' || inputs.benchmark == 'profile' || inputs.benchmark == 'waiting' || inputs.benchmark == 'parse-profile' || inputs.benchmark == 'phase-profile' || inputs.benchmark == 'phase-time' || inputs.benchmark == 'phase-flat' || inputs.benchmark == 'alloc-count'
    uses: ./.github/workflows/benchmark-probe.yml
    with:
      runner: ${{ inputs.runner }}
      script: ${{ inputs.benchmark == 'profile' && 'run-profile.py' || inputs.benchmark == 'waiting' && 'run-waiting.py' || inputs.benchmark == 'parse-profile' && 'run-parse-profile.py' || (inputs.benchmark == 'phase-profile' || inputs.benchmark == 'alloc-count') && 'run-phase-profile.py' || inputs.benchmark == 'phase-time' && 'run-phase-time.py' || inputs.benchmark == 'phase-flat' && 'run-phase-flat.py' || 'run-probe.py' }}
      native-profiler: ${{ inputs.benchmark == 'alloc-count' || inputs.benchmark == 'phase-profile' && inputs.phase != 'edit' }}
      phase: ${{ inputs.phase }}
      measure: ${{ inputs.benchmark == 'alloc-count' && 'allocs' || 'samples' }}
      storage: ${{ inputs.storage }}
      batches-per-engine: ${{ inputs.batches-per-engine }}
      feature-ref: ${{ inputs.feature-ref }}
      master-ref: ${{ inputs.master-ref }}
      profile: ${{ inputs.profile }}
      arena: ${{ inputs.arena }}
      grammars: ${{ inputs.grammars }}
      candidates: ${{ inputs.candidates }}
      build-path: ${{ inputs.build-path }}
