name: Build one benchmark addon

on:
  workflow_call:
    inputs:
      runner:
        description: The runner label every job runs on, which benchmarks.yml sets once
        type: string
        required: true
      grammar:
        type: string
        required: true
      prefix:
        type: string
        required: true
      ref:
        description: The commit to build; empty builds the commit the run is for
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  CARGO_BUILD_JOBS: '4'

jobs:
  build:
    name: Build ${{ inputs.grammar }} release addon
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/arena-benchmark-setup
      - name: The commit being built
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: binary
        with:
          path: ${{ runner.temp }}/arena-runtime-native-${{ inputs.grammar }}
          key: arena-runtime-v1-${{ runner.os }}-${{ runner.arch }}-node26.12.0-${{ steps.commit.outputs.sha }}-native-${{ inputs.grammar }}
      - uses: Swatinem/rust-cache@v2
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          shared-key: arena-benchmarks-linux
          key: ${{ inputs.grammar }}
          workspaces: . -> target
      - uses: actions/download-artifact@v4
        if: steps.binary.outputs.cache-hit != 'true'
        with:
          name: ${{ inputs.prefix }}-typescript
          path: ${{ runner.temp }}/arena-typescript
      - name: Restore compiled TypeScript
        if: steps.binary.outputs.cache-hit != 'true'
        run: node scripts/ci/arena-benchmark-runtime.mjs restore "$RUNNER_TEMP/arena-typescript" typescript
      - name: Build and archive the release addon
        if: steps.binary.outputs.cache-hit != 'true'
        env:
          GRAMMAR: ${{ inputs.grammar }}
        run: |
          bundle="$RUNNER_TEMP/arena-runtime-native-$GRAMMAR"
          pnpm exec tsx scripts/build-native.mts "$GRAMMAR" --release
          git diff --exit-code -- packages rust
          node scripts/ci/arena-benchmark-runtime.mjs pack "$bundle" "native-$GRAMMAR" "packages/$GRAMMAR/native" node_modules/.cache/sittir/native-build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.prefix }}-native-${{ inputs.grammar }}
          path: ${{ runner.temp }}/arena-runtime-native-${{ inputs.grammar }}/
          retention-days: 7
          if-no-files-found: error
