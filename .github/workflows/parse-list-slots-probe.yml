# The parse-list-slots probe's measurements on a dedicated Linux x64 runner:
# builds the rust, typescript and python addons in the release profile from
# this branch, then runs drive.mts, a fresh Node process per measurement.
# Runs on the probe branch only.
name: parse list slots probe

on:
  push:
    branches: [probe/parse-list-slots]
    paths:
      - .github/workflows/parse-list-slots-probe.yml
      - rust/crates/sittir-core/**
      - docs/superpowers/probes/2026-10-23-parse-list-slots/*.mjs
      - docs/superpowers/probes/2026-10-23-parse-list-slots/*.mts

env:
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_MULTIPLEXING: "false"
  PROBE: docs/superpowers/probes/2026-10-23-parse-list-slots

jobs:
  measure:
    name: measure (linux-x64-gnu)
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: pnpm
      - name: Rust (pinned)
        uses: ./.github/actions/rust-toolchain
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Machine
        shell: bash
        run: |
          rustc -vV
          node -p 'const os = require("node:os"); JSON.stringify({ cpus: os.cpus().length, model: os.cpus()[0].model, memory: os.totalmem() })'
      - name: Build the addons (release)
        shell: bash
        run: |
          for grammar in rust typescript python; do
            pnpm --dir "rust/crates/sittir-$grammar" run build
          done
      - name: parse-cost
        shell: bash
        run: pnpm exec tsx "$PROBE/drive.mts" --out "$RUNNER_TEMP/parse-cost"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parse-cost-linux-x64-gnu
          path: ${{ runner.temp }}/parse-cost/
          if-no-files-found: ignore
