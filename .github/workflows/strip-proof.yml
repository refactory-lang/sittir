name: Strip proof

# A probe, run from its own branch only. Each release binding is built by
# build-native, which keeps the unstripped link beside its stamp and strips
# the shipped one; on every target the copy and the shipped binary must have
# every allocated section byte-identical, so a tool reading the copy reads
# what ships. Every grammar is built on every target. The encode stack is
# read from each copy, the typed read's stack ceilings are measured on darwin
# arm64, all on the pinned toolchain, for information; the kept copies,
# stamps and Windows PDBs are uploaded. The builds are then repacked the
# way the release repacks them, and the layout is held to the complete set.

on:
  push:
    branches: [probe/strip-proof]

permissions:
  contents: read

env:
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'

jobs:
  build:
    name: copy and shipped (${{ matrix.target }})
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, host: macos-14, buildFlag: '', grammars: 'regex scm rust typescript python' }
          - { target: x86_64-apple-darwin, host: macos-14, buildFlag: '', grammars: 'regex scm rust typescript python' }
          - { target: x86_64-unknown-linux-gnu, host: ubuntu-22.04, buildFlag: '', grammars: 'regex scm rust typescript python' }
          - { target: x86_64-unknown-linux-musl, host: ubuntu-22.04, buildFlag: '--cross-compile', grammars: 'regex scm rust typescript python' }
          - { target: aarch64-unknown-linux-gnu, host: ubuntu-22.04, buildFlag: '--use-napi-cross', grammars: 'regex scm rust typescript python' }
          - { target: aarch64-unknown-linux-musl, host: ubuntu-22.04, buildFlag: '--cross-compile', grammars: 'regex scm rust typescript python' }
          - { target: x86_64-pc-windows-msvc, host: windows-2022, buildFlag: '', grammars: 'regex scm rust typescript python' }
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/rust-toolchain
        with:
          targets: ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - if: contains(matrix.target, 'musl')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - uses: Swatinem/rust-cache@v2
        with:
          key: strip-proof-${{ matrix.target }}
      - name: build each binding, and hold its unstripped copy to it
        shell: bash
        run: |
          set -euo pipefail
          report="sections-${{ matrix.target }}.md"
          : > "$report"
          status=0
          for g in ${{ matrix.grammars }}; do
            npx tsx scripts/build-native.mts "$g" --release --target "${{ matrix.target }}" ${{ matrix.buildFlag }}
            for f in packages/"$g"/native/*.node; do
              b=$(basename "$f")
              node .github/strip-proof/section-hashes.mjs "node_modules/.cache/sittir/native-build/$g/$b" "$f" "$b" >> "$report" || status=1
              if [[ "${{ matrix.target }}" == *windows-msvc ]]; then
                pdb="target/${{ matrix.target }}/release/sittir_${g}.pdb"
                cp "$pdb" "node_modules/.cache/sittir/native-build/$g/$b.pdb" || echo "no PDB at $pdb" >> "$report"
              fi
            done
          done
          cat "$report" >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: the pinned llvm-tools and the PDBs, for information
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        shell: bash
        run: |
          out="llvm-tools-${{ matrix.target }}.txt"
          bin="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin"
          { echo "$bin"; ls -1 "$bin"; echo; echo "PDBs:"; find target -name '*.pdb' -path '*release*'; } > "$out" 2>&1 || true
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - name: encode stack, for information
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          out="encode-stack-${{ matrix.target }}"
          npx tsx packages/cli/src/cli.ts tool encode-stack ${{ matrix.grammars }} --paths > "$out.txt" 2>&1 || echo "encode-stack exit $?" >> "$out.txt"
          npx tsx packages/cli/src/cli.ts tool encode-stack ${{ matrix.grammars }} --json > "$out.json" 2>> "$out.txt" || true
          cat "$out.txt" >> "$GITHUB_STEP_SUMMARY"
      - name: the typed read's stack ceilings on the pin, for information
        if: ${{ !cancelled() && matrix.target == 'aarch64-apple-darwin' }}
        shell: bash
        run: |
          out="ceilings-${{ matrix.target }}.txt"
          for profile in "" "--release"; do
            echo "== profile ${profile:-dev}" >> "$out"
            cargo test -p sittir-parity-tests --no-default-features $profile --test typed_read_nesting --target ${{ matrix.target }} -- --nocapture the_typed_read_stays_within_its_pinned_stack_ceilings >> "$out" 2>&1 || echo "cargo test exit $?" >> "$out"
          done
          rustc -vV >> "$out"
          cat "$out" >> "$GITHUB_STEP_SUMMARY"
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: sections-${{ matrix.target }}
          path: |
            sections-${{ matrix.target }}.md
            encode-stack-${{ matrix.target }}.txt
            encode-stack-${{ matrix.target }}.json
            llvm-tools-${{ matrix.target }}.txt
            ceilings-${{ matrix.target }}.txt
          if-no-files-found: warn
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: copies-${{ matrix.target }}
          path: node_modules/.cache/sittir/native-build/
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: |
            packages/*/native/*.node
          if-no-files-found: error

  layout:
    name: repack as the release does
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bindings-*
          merge-multiple: false
      # Every crate's platform packages, as the release creates them; only
      # regex, built on every target, is repacked.
      - name: create the platform packages and collect the bindings into them
        shell: bash
        run: |
          set -euo pipefail
          for crate in $(npx tsx packages/tools/src/scripts/list-grammars.ts stable); do
            (cd "rust/crates/sittir-${crate}" && pnpm exec napi create-npm-dirs)
          done
          (cd rust/crates/sittir-regex && pnpm exec napi artifacts --output-dir ../../../artifacts)
      - name: hold the layout to the complete set
        shell: bash
        run: |
          set -o pipefail
          node .github/strip-proof/layout.mjs --static $(npx tsx packages/tools/src/scripts/list-grammars.ts stable) --repack regex | tee -a "$GITHUB_STEP_SUMMARY"
