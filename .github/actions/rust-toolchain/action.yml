name: Rust toolchain
description: Install the Rust version rust-toolchain.toml pins, with any extra targets and components.
inputs:
  targets:
    description: Comma-separated targets to add.
    required: false
    default: ''
  components:
    description: Comma-separated components to add.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      run: echo "channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ inputs.components }}
