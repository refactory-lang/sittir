name: Rust toolchain
description: Install the Rust version and components rust-toolchain.toml pins, with any extra targets and components.
inputs:
  targets:
    description: Comma-separated targets to add.
    required: false
    default: ''
  components:
    description: Comma-separated components to add.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        EXTRA: ${{ inputs.components }}
      run: |
        echo "channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        pinned=$(sed -n 's/^components *= *\[\(.*\)\]$/\1/p' rust-toolchain.toml | tr -d '" ')
        echo "components=$(printf '%s,%s' "$pinned" "$EXTRA" | sed 's/^,*//; s/,*$//')" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ steps.pin.outputs.components }}
