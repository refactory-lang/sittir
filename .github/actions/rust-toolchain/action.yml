name: Rust toolchain
description: Install the Rust version and components rust-toolchain.toml pins, with any extra targets and components.
inputs:
  targets:
    description: Comma-separated targets to add.
    required: false
    default: ''
  components:
    description: Comma-separated components to add.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - id: pin
      shell: bash
      env:
        EXTRA: ${{ inputs.components }}
      run: |
        channel=$(sed -n 's/^channel *= *"\(.*\)"$/\1/p' rust-toolchain.toml)
        declared=$(sed -n '/^components *=/p' rust-toolchain.toml)
        listed=$(sed -n 's/^components *= *\[\(.*\)\]$/[\1]/p' rust-toolchain.toml)
        if [ -z "$channel" ] || { [ -n "$declared" ] && [ -z "$listed" ]; }; then
          echo '::error file=rust-toolchain.toml::rust-toolchain.toml must pin channel = "<version>" and list its components on one line, components = ["a", "b"]'
          exit 1
        fi
        pinned=$(printf '%s' "$listed" | tr -d '[]" ')
        echo "channel=$channel" >> "$GITHUB_OUTPUT"
        echo "components=$(printf '%s,%s' "$pinned" "$EXTRA" | sed 's/^,*//; s/,*$//')" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.pin.outputs.channel }}
        targets: ${{ inputs.targets }}
        components: ${{ steps.pin.outputs.components }}
    - name: Install lld where the image has none
      if: runner.os == 'Linux'
      shell: bash
      run: |
        # The engine's build.rs links every Linux target with -fuse-ld=lld, and the arm64 image ships no ld.lld.
        command -v ld.lld >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq lld; }
