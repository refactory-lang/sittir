name: Prepare arena benchmarks
description: Build the pinned tools and current release runtime before measurement.
runs:
  using: composite
  steps:
    - name: Prepare artifact directory
      shell: bash
      run: mkdir -p "$RUNNER_TEMP/arena-benchmarks"
    - uses: pnpm/action-setup@v4
    - uses: actions/setup-node@v6
      with:
        node-version: '26.12.0'
        cache: pnpm
    - uses: ./.github/actions/rust-toolchain
      with:
        targets: wasm32-wasip1
    - uses: Swatinem/rust-cache@v2
      with:
        shared-key: arena-benchmarks-macos-arm64
        workspaces: |
          . -> target
          docs/superpowers/probes/2026-10-12-record-wire/eager/native -> target
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile | tee "$RUNNER_TEMP/arena-benchmarks/install.log"
    - name: Verify benchmark reporting
      shell: bash
      run: node --test scripts/ci/arena-benchmark-report.test.mjs
    - name: Build TypeScript packages for generation
      shell: bash
      run: pnpm -r --filter './packages/*' --workspace-concurrency=1 run build | tee "$RUNNER_TEMP/arena-benchmarks/typescript-build.log"
    - uses: ./.github/actions/bootstrap
    - name: Generate all five grammars and parser WASMs
      shell: bash
      run: pnpm run regen:all --force 2>&1 | tee "$RUNNER_TEMP/arena-benchmarks/regen.log"
    - name: Build current release addons and compiled packages
      shell: bash
      run: pnpm -r --workspace-concurrency=1 run build 2>&1 | tee "$RUNNER_TEMP/arena-benchmarks/release-build.log"
    - name: Require generated source to match the commit
      shell: bash
      run: git diff --exit-code -- packages rust docs/superpowers/probes/2026-10-12-record-wire/eager
