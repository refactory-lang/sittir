[workspace]
resolver = "2"
members = ["rust/crates/*"]

# NOTE on workspace-root location (deviation from spec 012 task T002):
# T002 asked for `/rust/Cargo.toml` as the workspace root with members
# resolved via `..` paths. cargo 1.83+ enforces that every workspace
# member live hierarchically below the workspace root (rejected with
# "workspace member is not hierarchically below the workspace root"),
# which is why the workspace manifest lives at the repo root while the
# grammar-owned native crates live under `rust/crates/sittir-{lang}`.

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that don't fit this workspace:
# - match_same_arms: dispatch matches have one arm per kind, and arms
#   that share a body still name distinct kinds.
# - too_many_lines: the emitted per-kind dispatch and prepare bodies
#   grow with the grammar.
# - missing_errors_doc: each error type documents its variants; a
#   per-function `# Errors` section would repeat them.
# - struct_excessive_bools: a node's bool fields are the grammar's
#   presence flags, one per keyword slot.
# - similar_names: generated bindings take the grammar's slot names.
match_same_arms = "allow"
too_many_lines = "allow"
missing_errors_doc = "allow"
struct_excessive_bools = "allow"
similar_names = "allow"
allow_attributes_without_reason = "warn"
clone_on_ref_ptr = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
redundant_clone = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

[workspace.package]
version = "0.0.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/refactory-lang/sittir"

# A cdylib built with cargo's own stripping (`strip = "debuginfo"` or
# `"symbols"`) and the explicit `--target` that `napi build --platform` passes
# comes out with a "mis-aligned LINKEDIT string pool" on current macOS, and
# dyld refuses to load it. So cargo strips nothing here and
# `scripts/build-native.mts` strips a release binding after the build: on
# macOS with `strip -x` and an ad-hoc re-sign, elsewhere by turning cargo's
# symbol stripping on for that one build.
#
# Fat LTO over a single codegen unit is for size: the bindings ship inside the
# grammar packages, and whole-program optimization drops what the per-crate
# units keep. It costs build time, not render speed.
[profile.release]
strip = "none"
lto = "fat"
codegen-units = 1

# What local generation and validation build (the crates' `build:gate`):
# optimized like release, so validation's deep reads keep optimized stack
# frames (`typed_read_nesting`'s ceilings hold on it), without fat LTO's
# single-threaded link. CI and published bindings build `release`.
[profile.gate]
inherits = "release"
lto = "off"
codegen-units = 16

# Centralise common dependency versions so core + render + napi stay
# aligned. Per-crate `Cargo.toml` files pull these via
# `{ workspace = true }` or override when pinning is required.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# tree-sitter is a single-copy crate (`links = "tree-sitter"`), so every crate
# here resolves to this one series. Its minor version moves with the npm
# `tree-sitter-cli` and `web-tree-sitter` pins, which generate and load the
# parsers this crate links. Grammar crates (tree-sitter-rust,
# tree-sitter-python, tree-sitter-typescript) declare tree-sitter only as a
# *dev-dependency*; their production dep is tree-sitter-language 0.1 (a
# semver-stable ABI bridge with no `links` field), so they stay compatible.
tree-sitter = "0.27"
tree-sitter-language = "0.1.7"
sha2 = "0.11"
cc = "1"
# Insertion-order-preserving map for UntypedNode.fields (sittir-core) —
# std::collections::HashMap's per-instance random iteration order made
# native slot-key serialization order (and therefore "first node of
# kind K" candidate selection during validation) nondeterministic
# across parses. IndexMap preserves tree-sitter child insertion order.
indexmap = { version = "2", features = ["serde"] }
